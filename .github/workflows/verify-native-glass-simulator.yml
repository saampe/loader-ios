name: Native Liquid Glass Simulator Proof
on:
  push:
    branches: [main]
    paths:
      - 'tests/native-glass-simulator/**'
      - 'sources/NativeGlassHost.m'
      - 'headers/NativeGlassHost.h'
      - '.github/workflows/verify-native-glass-simulator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-proof:
    name: Render true UIKit glass in simulator (no Discord IPA)
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available
      - name: Verify actual Objective-C glass API declarations
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          find "$SDK/System/Library/Frameworks/UIKit.framework/Headers" -iname '*Glass*' -print
          grep -R -n -A 15 -B 5 '@interface UIGlassEffect\|UIGlassEffectStyleClear\|effectWithStyle\|initWithStyle' "$SDK/System/Library/Frameworks/UIKit.framework/Headers" | head -110 || true
      - name: Build isolated UIKit application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/GlassProof.app"
          cp tests/native-glass-simulator/Info.plist "$RUNNER_TEMP/GlassProof.app/Info.plist"
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          ARCH="$(uname -m)"
          xcrun clang -fobjc-arc -target "${ARCH}-apple-ios26.0-simulator" \
            -isysroot "$SDK" -I headers \
            -c sources/NativeGlassHost.m -o "$RUNNER_TEMP/NativeGlassHost.o"
          xcrun clang -fobjc-arc -target "${ARCH}-apple-ios26.0-simulator" \
            -isysroot "$SDK" -I headers \
            -c tests/native-glass-simulator/GlassHostShim.m -o "$RUNNER_TEMP/GlassHostShim.o"
          xcrun swiftc \
            -parse-as-library \
            -sdk "$SDK" \
            -target "${ARCH}-apple-ios26.0-simulator" \
            -framework UIKit \
            "$RUNNER_TEMP/NativeGlassHost.o" "$RUNNER_TEMP/GlassHostShim.o" \
            -Xlinker -rpath -Xlinker @executable_path/Frameworks \
            tests/native-glass-simulator/GlassDemo.swift \
            -o "$RUNNER_TEMP/GlassProof.app/GlassProof"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_TEMP/GlassProof.app/Info.plist"
      - name: Boot simulator and render screenshot
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages Pillow
          UDID="$(xcrun simctl list devices available | grep -m1 -E 'iPhone .*\([A-F0-9-]{36}\)' | sed -E 's/.*\(([A-F0-9-]{36})\).*/\1/')"
          test -n "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$RUNNER_TEMP/GlassProof.app"
          xcrun simctl launch "$UDID" dev.unbound.nativeglassproof
          sleep 3
          mkdir -p proof
          xcrun simctl io "$UDID" screenshot proof/native-glass-simulator.png
          xcrun simctl terminate "$UDID" dev.unbound.nativeglassproof
          xcrun simctl launch "$UDID" dev.unbound.nativeglassproof --baseline
          sleep 3
          xcrun simctl io "$UDID" screenshot proof/native-glass-baseline.png
          test -s proof/native-glass-simulator.png
          test -s proof/native-glass-baseline.png
          xcrun simctl terminate "$UDID" dev.unbound.nativeglassproof
          xcrun simctl launch "$UDID" dev.unbound.nativeglassproof --tabs
          sleep 3
          xcrun simctl io "$UDID" screenshot proof/native-tabs-liquid-glass.png
          xcrun simctl terminate "$UDID" dev.unbound.nativeglassproof
          xcrun simctl launch "$UDID" dev.unbound.nativeglassproof --tabs --tabs-baseline
          sleep 3
          xcrun simctl io "$UDID" screenshot proof/native-tabs-opaque-baseline.png
          test -s proof/native-tabs-liquid-glass.png
          test -s proof/native-tabs-opaque-baseline.png
          xcrun simctl terminate "$UDID" dev.unbound.nativeglassproof
          xcrun simctl launch "$UDID" dev.unbound.nativeglassproof --actual-host
          # A launch can return before SpringBoard has presented the app.
          # Capture the actual glass fixture, not a white splash screen.
          GLASS_READY=0
          for attempt in $(seq 1 14); do
            sleep 2
            xcrun simctl io "$UDID" screenshot proof/actual-objc-host-glass.png
            if python3 - <<'PY'
          from PIL import Image
          im=Image.open("proof/actual-objc-host-glass.png").convert("RGB")
          w,h=im.size
          samples=[im.getpixel((int(w*0.08),int(h*f))) for f in (0.59,0.73,0.86)]
          assert all(max(rgb)-min(rgb)>25 for rgb in samples), samples
          PY
            then
              GLASS_READY=1
              break
            fi
            echo "Actual glass fixture not rendered, retry $attempt"
          done
          test "$GLASS_READY" = 1
          DATA="$(xcrun simctl get_app_container "$UDID" dev.unbound.nativeglassproof data)"
          RESULT="$DATA/Documents/native-glass-marker-result.txt"
          test -s "$RESULT"
          echo "Native glass marker result: $(cat "$RESULT")"
          grep -Fxq "PASS" "$RESULT"
          xcrun simctl terminate "$UDID" dev.unbound.nativeglassproof
          xcrun simctl launch "$UDID" dev.unbound.nativeglassproof --actual-host --actual-host-baseline
          # A previous green simulator run captured a white splash screen as
          # the baseline. Re-check the actual colored fixture before accepting.
          BASELINE_READY=0
          for attempt in $(seq 1 14); do
            sleep 2
            xcrun simctl io "$UDID" screenshot proof/actual-objc-host-baseline.png
            if python3 - <<'PY'
          from PIL import Image
          im=Image.open("proof/actual-objc-host-baseline.png").convert("RGB")
          w,h=im.size
          samples=[im.getpixel((int(w*0.08),int(h*f))) for f in (0.59,0.73,0.86)]
          # A loaded fixture has distinct vivid horizontal color bands; an
          # unrendered SpringBoard/splash frame is near-white at all samples.
          assert all(max(rgb)-min(rgb)>25 for rgb in samples), samples
          PY
            then
              BASELINE_READY=1
              break
            fi
            echo "Actual host baseline not rendered, retry $attempt"
          done
          test "$BASELINE_READY" = 1
          test -s proof/actual-objc-host-glass.png
          test -s proof/actual-objc-host-baseline.png
          DATA="$(xcrun simctl get_app_container "$UDID" dev.unbound.nativeglassproof data)"
          RESULT="$DATA/Documents/native-glass-marker-result.txt"
          test -s "$RESULT"
          echo "Exact native marker attachment result: $(cat "$RESULT")"
          grep -Fxq "PASS" "$RESULT"
      - name: Analyze actual screenshot differences
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 - <<'PY'
          from PIL import Image, ImageChops, ImageFilter, ImageStat
          from pathlib import Path
          import json
          # Require comparable rendered app frames, not blank white launches.
          host_glass = Image.open("proof/actual-objc-host-glass.png").convert("RGB")
          host_base = Image.open("proof/actual-objc-host-baseline.png").convert("RGB")
          assert host_glass.size == host_base.size
          w,h = host_glass.size
          for frac in (0.59,0.73,0.86):
              x,y = int(w*0.08),int(h*frac)
              g,b = host_glass.getpixel((x,y)),host_base.getpixel((x,y))
              assert max(b)-min(b)>25, ("blank baseline",y,b)
              assert max(abs(i-j) for i,j in zip(g,b))<40, ("mismatched fixture",y,g,b)
          a = Image.open("proof/native-glass-simulator.png").convert("RGB")
          b = Image.open("proof/native-glass-baseline.png").convert("RGB")
          assert a.size == b.size, (a.size, b.size)
          # Blurring reduces differences caused solely by text, not glass material.
          delta = ImageChops.difference(a.filter(ImageFilter.GaussianBlur(12)), b.filter(ImageFilter.GaussianBlur(12)))
          stats = ImageStat.Stat(delta)
          max_diff = max(delta.getextrema()[i][1] for i in range(3))
          report = {
            "dimensions": list(a.size),
            "mean_blurred_rgb_difference": [round(x, 3) for x in stats.mean],
            "max_blurred_channel_difference": max_diff,
            "difference_bbox": delta.getbbox(),
            "note": "A nonzero difference confirms rendering changed, not that Liquid Glass looks correct. Inspect screenshots visually."
          }
          Path("proof/visual-difference.json").write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY
          echo "Simulator screenshot captured. Screenshot visual inspection is still required."
      - name: Upload simulator screenshot (not a Discord IPA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-glass-simulator-proof
          path: proof/
          if-no-files-found: error
