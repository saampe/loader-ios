name: Verify Native Theme Code
on:
  push:
    branches: [main]
    paths:
      - 'sources/Themes.x'
      - 'sources/DevOverlay.m'
      - 'sources/NativeGlassProbe.m'
      - 'headers/Themes.h'
      - '.github/workflows/verify-theme-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-native:
    name: Compile loader (no Discord IPA)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Test build tools
        run: go test ./...
      - name: Prepare Theos
        uses: Randomblock1/theos-action@4e23d15886bca77b5f7c462a82567e0de33ebe0b
      - name: Install Autotools
        run: |
          brew install autoconf automake libtool
          echo "$(brew --prefix autoconf)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix automake)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix libtool)/bin" >> "$GITHUB_PATH"
      - name: Compile native tweak (debug disables release attestation)
        run: make DEBUG=1 package
